name: Build RadniSati APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Extract project
        run: unzip -o RadniSati-projekat.zip

      - name: Build APK
        run: |
          cd RadniSati
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: RadniSati-APK
          path: RadniSati/app/build/outputs/apk/debug/app-debug.apk
